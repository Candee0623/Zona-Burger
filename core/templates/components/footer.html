<footer class="site-footer">

    <div class="footer-content">

        <div class="footer-text">
            <span class="footer-kicker">ZONA BURGER</span>

            <h3>Seguinos y enterate de nuestras novedades</h3>

            <p>
                Promociones, novedades y mucho sabor. Encontranos en nuestras redes.
            </p>
        </div>


        <div class="footer-socials">

            {% if negocio.telefono %}
                <a
                    href="https://wa.me/{{ negocio.telefono }}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="footer-social whatsapp"
                >
                    <i class="fab fa-whatsapp"></i>
                    <span>WhatsApp</span>
                </a>
            {% endif %}

            {% if instagram %}
                <a
                    href="{{ instagram.enlace }}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="footer-social instagram"
                >
                    <i class="fab fa-instagram"></i>
                    <span>Instagram</span>
                </a>
            {% endif %}

        </div>

    </div>


    <div class="footer-bottom">

        <p>
            &copy; 2026
            {{ negocio.nombre|default:"Zona Burger" }}.
            Todos los derechos reservados.
        </p>

    </div>

</footer>
