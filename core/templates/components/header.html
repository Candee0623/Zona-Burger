{% load static %}

<div class="zb-header-wrapper">
    <header class="zb-site-header">
        <nav class="zb-navbar">

            <!-- =====================================================
                 MARCA
            ====================================================== -->
            <div class="zb-brand">
                <a href="{% url 'index' %}" class="zb-brand-link">

                    <div class="zb-logo-wrapper">
                        <img
                            src="{% static 'img/logo.png' %}"
                            alt="Logo de {{ negocio.nombre|default:'Zona Burger' }}"
                        >
                    </div>

                    <div class="zb-brand-info">
                        <h1>
                            {{ negocio.nombre|default:"Zona Burger" }}
                        </h1>

                        <span>
                            LA CALIDAD QUE TE MERECES
                        </span>
                    </div>

                </a>
            </div>


            <!-- =====================================================
                 NAVEGACIÓN
            ====================================================== -->
            <ul class="zb-nav-links" id="zb-nav-menu">

                <li>
                    <a href="{% url 'index' %}" class="zb-nav-link">
                        <span>Inicio</span>
                    </a>
                </li>

                <li>
                    <a href="{% url 'menu' %}" class="zb-nav-link zb-nav-menu-link">
                        <span>Menú</span>
                    </a>
                </li>

            </ul>


            <!-- =====================================================
                 BOTÓN MÓVIL
            ====================================================== -->
            <button
                class="zb-menu-toggle"
                id="zb-menu-toggle"
                type="button"
                aria-label="Abrir menú"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

        </nav>
    </header>
</div>


<style>

/* ============================================================
   ZONA BURGER — HEADER
   Todo queda encapsulado con prefijo zb-
============================================================ */

.zb-header-wrapper {
    position: relative !important;
    z-index: 3000 !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    box-sizing: border-box !important;
}

.zb-header-wrapper *,
.zb-header-wrapper *::before,
.zb-header-wrapper *::after {
    box-sizing: border-box;
}


/* ============================================================
   HEADER
============================================================ */

.zb-site-header {
    position: relative !important;

    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;

    background:
        linear-gradient(
            180deg,
            #111111 0%,
            #0b0b0b 100%
        ) !important;

    border: 0 !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07) !important;

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.28) !important;

    color: #ffffff !important;

    font-family: 'Montserrat', sans-serif;
}


/* ============================================================
   NAVBAR
============================================================ */

.zb-navbar {
    position: relative !important;

    width: min(1200px, calc(100% - 40px)) !important;
    min-height: 76px !important;

    margin: 0 auto !important;
    padding: 0 !important;

    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;

    gap: 30px;

    background: transparent !important;
    border: 0 !important;
}


/* ============================================================
   MARCA
============================================================ */

.zb-brand {
    display: flex !important;
    align-items: center !important;

    margin: 0 !important;
    padding: 0 !important;

    flex-shrink: 0;
}

.zb-brand-link {
    display: flex !important;
    align-items: center !important;

    gap: 12px;

    margin: 0 !important;
    padding: 0 !important;

    color: #ffffff !important;
    text-decoration: none !important;

    background: transparent !important;
    border: 0 !important;
}

.zb-brand-link:hover {
    color: #ffffff !important;
    text-decoration: none !important;
}


/* ============================================================
   LOGO
============================================================ */

.zb-logo-wrapper {
    width: 46px !important;
    height: 46px !important;

    min-width: 46px !important;
    min-height: 46px !important;

    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    overflow: hidden !important;

    border-radius: 50% !important;

    background: #171717 !important;

    border: 2px solid #d82505 !important;

    box-shadow:
        0 0 0 4px rgba(216, 37, 5, 0.08) !important;

    transition:
        transform .25s ease,
        box-shadow .25s ease !important;
}

.zb-logo-wrapper img {
    display: block !important;

    width: 100% !important;
    height: 100% !important;

    max-width: none !important;

    margin: 0 !important;
    padding: 0 !important;

    object-fit: cover !important;

    border: 0 !important;
}

.zb-brand-link:hover .zb-logo-wrapper {
    transform: scale(1.04);
    box-shadow:
        0 0 0 4px rgba(216, 37, 5, 0.15) !important;
}


/* ============================================================
   TEXTO DE MARCA
============================================================ */

.zb-brand-info {
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;

    margin: 0 !important;
    padding: 0 !important;
}

.zb-brand-info h1 {
    display: block !important;

    margin: 0 !important;
    padding: 0 !important;

    color: #ffffff !important;

    font-family: 'Montserrat', sans-serif !important;

    font-size: 1.18rem !important;
    line-height: 1.1 !important;

    font-weight: 900 !important;

    letter-spacing: -0.4px !important;

    text-transform: none !important;

    background: transparent !important;
    border: 0 !important;
}

.zb-brand-info span {
    display: block !important;

    margin: 4px 0 0 !important;
    padding: 0 !important;

    color: #d82505 !important;

    font-family: 'Montserrat', sans-serif !important;

    font-size: .55rem !important;
    line-height: 1 !important;

    font-weight: 800 !important;

    letter-spacing: 1.8px !important;

    text-transform: none !important;
}


/* ============================================================
   NAVEGACIÓN
============================================================ */

.zb-nav-links {
    display: flex !important;
    align-items: center !important;

    gap: 6px;

    margin: 0 !important;
    padding: 0 !important;

    list-style: none !important;

    background: transparent !important;
    border: 0 !important;
}

.zb-nav-links li {
    display: block !important;

    margin: 0 !important;
    padding: 0 !important;

    list-style: none !important;
}

.zb-nav-link {
    position: relative !important;

    display: flex !important;
    align-items: center !important;

    height: 76px !important;

    margin: 0 !important;
    padding: 0 20px !important;

    color: #a9a9a9 !important;

    background: transparent !important;

    border: 0 !important;
    border-radius: 0 !important;

    text-decoration: none !important;

    font-family: 'Montserrat', sans-serif !important;
    font-size: .82rem !important;
    font-weight: 800 !important;

    line-height: 1 !important;

    text-transform: uppercase !important;
    letter-spacing: 1px !important;

    transition:
        color .2s ease !important;
}

.zb-nav-link:hover {
    color: #ffffff !important;

    background: transparent !important;

    text-decoration: none !important;
}


/* ============================================================
   LÍNEA ROJA INFERIOR
============================================================ */

.zb-nav-link::after {
    content: "";

    position: absolute !important;

    left: 20px !important;
    right: 20px !important;
    bottom: 0 !important;

    width: auto !important;
    height: 3px !important;

    margin: 0 !important;
    padding: 0 !important;

    background:
        linear-gradient(
            90deg,
            #9e1c06,
            #d82505,
            #f03816
        ) !important;

    border: 0 !important;
    border-radius: 5px 5px 0 0 !important;

    transform: scaleX(0) !important;
    transform-origin: center !important;

    transition:
        transform .22s ease !important;
}

.zb-nav-link:hover::after {
    transform: scaleX(1) !important;
}


/* ============================================================
   MENÚ
   Sin fondo rojo.
   Sin barra vertical.
============================================================ */

.zb-nav-menu-link {
    color: #ffffff !important;
}

.zb-nav-menu-link::before {
    display: none !important;
}

.zb-nav-menu-link::after {
    transform: scaleX(0) !important;
}

.zb-nav-menu-link:hover::after {
    transform: scaleX(1) !important;
}


/* ============================================================
   BOTÓN HAMBURGUESA
============================================================ */

.zb-menu-toggle {
    display: none;

    width: 44px !important;
    height: 44px !important;

    min-width: 44px !important;

    margin: 0 !important;
    padding: 0 !important;

    border: 0 !important;
    border-radius: 0 !important;

    background: transparent !important;

    cursor: pointer;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 5px;
}

.zb-menu-toggle span {
    display: block !important;

    width: 24px !important;
    height: 3px !important;

    margin: 0 !important;
    padding: 0 !important;

    border: 0 !important;
    border-radius: 4px !important;

    background: #ffffff !important;

    transition:
        transform .25s ease,
        opacity .2s ease,
        background .2s ease !important;
}

.zb-menu-toggle:hover {
    background: transparent !important;
}

.zb-menu-toggle:hover span {
    background: #d82505 !important;
}


/* ============================================================
   ANIMACIÓN HAMBURGUESA
============================================================ */

.zb-menu-toggle.active span:nth-child(1) {
    transform: translateY(8px) rotate(45deg);
}

.zb-menu-toggle.active span:nth-child(2) {
    opacity: 0;
}

.zb-menu-toggle.active span:nth-child(3) {
    transform: translateY(-8px) rotate(-45deg);
}


/* ============================================================
   TABLET / MÓVIL
============================================================ */

@media (max-width: 700px) {

    .zb-navbar {
        width: calc(100% - 24px) !important;

        min-height: 68px !important;

        gap: 15px;
    }

    .zb-logo-wrapper {
        width: 40px !important;
        height: 40px !important;

        min-width: 40px !important;
        min-height: 40px !important;
    }

    .zb-brand-link {
        gap: 10px;
    }

    .zb-brand-info h1 {
        font-size: 1.02rem !important;
    }

    .zb-brand-info span {
        font-size: .48rem !important;
        letter-spacing: 1.4px !important;
    }


    /* -----------------------------------------
       HAMBURGUESA
    ----------------------------------------- */

    .zb-menu-toggle {
        display: flex !important;
    }


    /* -----------------------------------------
       MENÚ DESPLEGABLE
    ----------------------------------------- */

    .zb-nav-links {
        position: absolute !important;

        top: 68px !important;
        left: -12px !important;
        right: -12px !important;

        width: auto !important;

        display: none !important;

        flex-direction: column !important;
        align-items: stretch !important;

        gap: 0 !important;

        margin: 0 !important;
        padding: 8px 12px 14px !important;

        background: #0b0b0b !important;

        border-top: 1px solid rgba(255, 255, 255, .05) !important;
        border-bottom: 1px solid rgba(255, 255, 255, .08) !important;

        box-shadow:
            0 15px 35px rgba(0, 0, 0, .45) !important;
    }

    .zb-nav-links.active {
        display: flex !important;
    }

    .zb-nav-links li {
        width: 100% !important;
    }

    .zb-nav-link {
        width: 100% !important;
        height: 50px !important;

        padding: 0 14px !important;

        justify-content: flex-start !important;

        border-radius: 6px !important;

        color: #a9a9a9 !important;
    }

    .zb-nav-link:hover {
        color: #ffffff !important;
        background: transparent !important;
    }

    .zb-nav-link::after {
        left: 14px !important;
        right: auto !important;

        width: 38px !important;
    }

    .zb-nav-menu-link {
        color: #ffffff !important;
    }

    .zb-nav-menu-link::before {
        display: none !important;
    }
}


/* ============================================================
   MÓVIL PEQUEÑO
============================================================ */

@media (max-width: 420px) {

    .zb-navbar {
        width: calc(100% - 18px) !important;
    }

    .zb-brand-link {
        gap: 9px;
    }

    .zb-logo-wrapper {
        width: 38px !important;
        height: 38px !important;

        min-width: 38px !important;
        min-height: 38px !important;
    }

    .zb-brand-info h1 {
        font-size: .95rem !important;
    }

    .zb-brand-info span {
        display: none !important;
    }
}

</style>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const menuToggle = document.getElementById("zb-menu-toggle");
    const navMenu = document.getElementById("zb-nav-menu");

    if (!menuToggle || !navMenu) {
        return;
    }


    /* ========================================================
       ABRIR / CERRAR MENÚ
    ======================================================== */

    menuToggle.addEventListener("click", function (event) {

        event.stopPropagation();

        const abierto = navMenu.classList.toggle("active");

        menuToggle.classList.toggle("active", abierto);

        menuToggle.setAttribute(
            "aria-expanded",
            abierto ? "true" : "false"
        );

        menuToggle.setAttribute(
            "aria-label",
            abierto ? "Cerrar menú" : "Abrir menú"
        );

    });


    /* ========================================================
       CERRAR AL SELECCIONAR UNA OPCIÓN
    ======================================================== */

    navMenu.querySelectorAll("a").forEach(function (link) {

        link.addEventListener("click", function () {

            navMenu.classList.remove("active");

            menuToggle.classList.remove("active");

            menuToggle.setAttribute(
                "aria-expanded",
                "false"
            );

            menuToggle.setAttribute(
                "aria-label",
                "Abrir menú"
            );

        });

    });


    /* ========================================================
       CERRAR AL HACER CLICK AFUERA
    ======================================================== */

    document.addEventListener("click", function (event) {

        const headerWrapper = document.querySelector(
            ".zb-header-wrapper"
        );

        if (!headerWrapper) {
            return;
        }

        if (!headerWrapper.contains(event.target)) {

            navMenu.classList.remove("active");

            menuToggle.classList.remove("active");

            menuToggle.setAttribute(
                "aria-expanded",
                "false"
            );

            menuToggle.setAttribute(
                "aria-label",
                "Abrir menú"
            );

        }

    });

});

</script>
