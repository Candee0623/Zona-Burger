{% load static %}
<div class="header-fixed-wrapper">
    <header>
        <nav class="navbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <img src="{% static 'img/logo.png' %}" alt="Logo de {{ negocio.nombre|default:'Zona Burger' }}" style="width: 42px; height: 42px; object-fit: cover; border-radius: 50%;">
                <h1 style="color: #ffffff; font-size: 1.25rem; margin: 0; font-weight: 700;">{{ negocio.nombre|default:"Zona Burger" }}</h1>
            </div>
            
            <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <ul class="nav-links" id="nav-menu">
                <li><a href="{% url 'index' %}">Inicio</a></li>
                <li><a href="{% url 'menu' %}">Menú</a></li>
            </ul>
        </nav>
    </header>
</div>
