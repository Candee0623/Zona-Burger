{% extends "panel/base.html" %}

{% block content %}
<div class="form-container">
    <h1>Nueva zona de entrega</h1>
    <p class="subtitulo">Ingresá los datos de la zona.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="mensaje">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="campo">
            <label for="nombre">Nombre de la zona</label>
            <input type="text" id="nombre" name="nombre" maxlength="50"
                   placeholder="Ej. Centro" required
                   value="{{ request.POST.nombre|default:'' }}">
        </div>

        <div class="campo">
            <label for="costoenvio">Costo de envío</label>
            <input type="number" id="costoenvio" name="costoenvio"
                   min="0" step="0.01" value="{{ request.POST.costoenvio|default:'0.00' }}" required>
        </div>

        <div class="campo">
            <label for="idnegocio">ID del negocio</label>
            <input type="number" id="idnegocio" name="idnegocio"
                   min="1" placeholder="Ej. 1"
                   value="{{ request.POST.idnegocio|default:'' }}">
        </div>

        <div class="botones">
            <button type="submit" class="btn btn-guardar">Crear zona</button>
            <a href="{% url 'zonas_entrega_lista' %}" class="btn btn-volver">Cancelar</a>
        </div>
    </form>
</div>

<style>
.form-container { width: 100%; max-width: 850px; }
.form-container h1 { margin-bottom: 5px; font-size: 28px; }
.subtitulo { color: #777; margin-bottom: 25px; }
.campo { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.campo label { font-weight: 600; }
.campo input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #d6d6d6; border-radius: 6px; font-size: 15px; }
.campo input:focus { outline: 2px solid #f4a4a9; border-color: #e63946; }
.botones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 25px; }
.btn { padding: 11px 16px; border: 0; border-radius: 6px; text-decoration: none; cursor: pointer; font-size: 14px; }
.btn-guardar { background: #e63946; color: white; }
.btn-volver { background: #eee; color: #333; }
.mensaje { padding: 12px; margin-bottom: 15px; background: #fff0cc; border-radius: 6px; }
</style>
{% endblock %}
