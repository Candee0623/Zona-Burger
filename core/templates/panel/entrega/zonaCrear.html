{% extends "panel/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/panel/entrega/zonaCrear.css' %}">

<div class="form-container">
    <h1>Nueva zona de entrega</h1>
    <p class="subtitulo">Ingresá los datos de la zona.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="mensaje">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="campo">
            <label for="nombre">Nombre de la zona</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                maxlength="50"
                placeholder="Ej. Centro"
                required
                value="{{ nombre_ingresado|default:'' }}"
            >
        </div>

        <div class="campo">
            <label for="costoenvio">Costo de envío</label>
            <input
                type="number"
                id="costoenvio"
                name="costoenvio"
                min="0"
                step="0.01"
                placeholder="Ej. 1500.00"
                value="{{ costo_ingresado|default:'0.00' }}"
                required
            >
        </div>

        <div class="campo">
            <label for="idnegocio">Sucursal</label>
            <select id="idnegocio" name="idnegocio" required>
                <option value="">Seleccioná una sucursal</option>

                {% for negocio in negocios %}
                    <option
                        value="{{ negocio.idnegocio }}"
                        {% if negocio_seleccionado == negocio.idnegocio|stringformat:"s" %}
                            selected
                        {% endif %}
                    >
                        {{ negocio.nombre }}
                    </option>
                {% empty %}
                    <option value="" disabled>
                        No hay sucursales registradas
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="botones">
            <button type="submit" class="btn btn-guardar">
                Crear zona
            </button>

            <a href="{% url 'zonas_entrega_lista' %}" class="btn btn-volver">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
