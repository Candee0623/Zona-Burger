{% extends 'panel/base.html' %}

{% block title %}Zona-Burger | Eliminar categoría{% endblock %}

{% block content %}

<div style="
    max-width: 600px;
    margin: 40px auto;
    background: #181818;
    padding: 30px;
    border-radius: 8px;
    border: 1px solid #333;
    color: #fff;
">

    <h1>Eliminar categoría</h1>

    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

    <p>
        OBJETO:
        <strong>{{ objeto }}</strong>
    </p>

    <p>
        NOMBRE:
        <strong>{{ objeto.nombre }}</strong>
    </p>

    <p>
        ID:
        <strong>{{ objeto.idcategoria }}</strong>
    </p>

    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

    <form method="post">
        {% csrf_token %}

        <button
            type="submit"
            style="
                padding: 10px 20px;
                background: #ff4757;
                border: none;
                color: white;
                font-weight: bold;
                border-radius: 4px;
                cursor: pointer;
            "
        >
            Sí, eliminar
        </button>

        <a
            href="{% url 'categoria_lista' %}"
            style="
                display: inline-block;
                padding: 10px 20px;
                background: #333;
                color: white;
                text-decoration: none;
                border-radius: 4px;
                margin-left: 10px;
            "
        >
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
