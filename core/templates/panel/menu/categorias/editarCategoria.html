{% extends 'panel/base.html' %}
{% block title %}Zona-Burger | Editar categoría{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 600px; background: #181818; padding: 25px; border-radius: 8px; border: 1px solid #333;">
    <h1 style="margin-bottom: 20px; font-size: 1.5rem;">Editar categoría</h1>

    {% if errores %}
        <ul class="errores" style="color: #ff6b6b; margin-bottom: 15px;">
            {% for error in errores %}<li>{{ error }}</li>{% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom: 15px;">
            <label for="nombre" style="display: block; margin-bottom: 5px; color: #ccc;">Nombre</label>
            <input type="text" id="nombre" name="nombre" class="form-control" value="{{ categoria.nombre }}" style="width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px;" required>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn btn-primary" style="padding: 10px 20px; background: #00d26a; border: none; color: #000; font-weight: bold; border-radius: 4px; cursor: pointer;">Guardar cambios</button>
            <a href="{% url 'categoria_lista' %}" class="btn" style="padding: 10px 20px; background: #333; color: #fff; text-decoration: none; border-radius: 4px; display: inline-block;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
