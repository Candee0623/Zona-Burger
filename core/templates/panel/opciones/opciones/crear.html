{% extends 'panel/base.html' %}
{% block title %}Zona-Burger | Nueva opción{% endblock %}

{% block content %}
<h1>Nueva opción</h1>

{% if errores %}
    <ul class="errores">
        {% for error in errores %}<li>{{ error }}</li>{% endfor %}
    </ul>
{% endif %}

<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="idgrupo">Grupo</label>
        <select id="idgrupo" name="idgrupo" class="form-control" required>
            <option value="">---------</option>
            {% for grupo in grupos %}
            <option value="{{ grupo.idgrupo }}"
                {% if grupo.idgrupo|stringformat:"s" == request.GET.idgrupo %}selected{% endif %}>
                {{ grupo.nombre }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Coca-Cola" required>
    </div>

    <div class="form-group">
        <label for="precioadicional">Precio adicional</label>
        <input type="number" step="0.01" id="precioadicional" name="precioadicional" class="form-control" value="0">
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'opcion_lista' %}" class="btn">Cancelar</a>
</form>
{% endblock %}
