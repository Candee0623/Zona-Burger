{% extends 'panel/base.html' %}
{% block title %}Zona-Burger | Editar opción{% endblock %}

{% block content %}
<h1>Editar opción</h1>

{% if errores %}
    <ul class="errores">
        {% for error in errores %}<li>{{ error }}</li>{% endfor %}
    </ul>
{% endif %}

<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="idgrupo">Grupo</label>
        <select id="idgrupo" name="idgrupo" class="form-control" required>
            <option value="">---------</option>
            {% for grupo in grupos %}
            <option value="{{ grupo.idgrupo }}"
                {% if opcion.idgrupo_id == grupo.idgrupo %}selected{% endif %}>
                {{ grupo.nombre }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" class="form-control" value="{{ opcion.nombre }}" required>
    </div>

    <div class="form-group">
        <label for="precioadicional">Precio adicional</label>
        <input type="number" step="0.01" id="precioadicional" name="precioadicional" class="form-control"
               value="{{ opcion.precioadicional|default:0 }}">
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'opcion_lista' %}" class="btn">Cancelar</a>
</form>
{% endblock %}
