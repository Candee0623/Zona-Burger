{% load static %}
<div class="rep-filters" id="rep-filtros">
    <div class="rep-field">
        <label for="rep-inicio">Desde</label>
        <input id="rep-inicio" type="date" value="{{ fecha_inicio|date:'Y-m-d' }}">
    </div>
    <div class="rep-field">
        <label for="rep-fin">Hasta</label>
        <input id="rep-fin" type="date" value="{{ fecha_fin|date:'Y-m-d' }}">
    </div>
    <button type="button" id="rep-aplicar" class="rep-btn rep-btn-primary">
        <i class="fa-solid fa-filter"></i> Aplicar
    </button>

    <div class="rep-presets" role="group" aria-label="Rangos rápidos">
        <button type="button" class="rep-chip" data-preset="hoy">Hoy</button>
        <button type="button" class="rep-chip" data-preset="7">7 días</button>
        <button type="button" class="rep-chip" data-preset="30">30 días</button>
        <button type="button" class="rep-chip" data-preset="mes">Este mes</button>
        <button type="button" class="rep-chip" data-preset="mes-anterior">Mes anterior</button>
    </div>
</div>

<p class="rep-period">Mostrando datos del <strong>{{ periodo }}</strong></p>

<script src="{% static 'js/panel/reportes/filtros.js' %}"></script>
