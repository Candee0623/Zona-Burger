<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Promoción</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 40px; }
        .contenedor { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 10px; text-align: center; }
        .btn { padding: 10px 20px; border-radius: 4px; border: 0; cursor: pointer; color: white; font-size: 15px; text-decoration: none; display: inline-block; }
        .btn-eliminar { background: #dc3545; }
        .btn-cancelar { background: #6c757d; margin-left: 10px; }
    </style>
</head>
<body>
<div class="contenedor">
    <h2>¿Estás seguro de eliminar esta promoción?</h2>
    <p>Se eliminará el código: <strong>{{ promocion.palabraclave }}</strong></p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-eliminar">Sí, eliminar</button>
        <a href="{% url 'lista_promociones' %}" class="btn btn-cancelar">Cancelar</a>
    </form>
</div>
</body>
</html>
