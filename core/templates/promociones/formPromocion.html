{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'css/promociones/formPromocion.css' %}">
</head>
<body data-es-nuevo="{% if not promocion.pk %}true{% else %}false{% endif %}">
    <div class="page-wrapper">
        <div class="page-header">
            <h1>{{ titulo }}</h1>
            <span>Configuración de beneficios y vigencia</span>
        </div>

        <div class="contenedor">
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST" id="formPromocion">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="palabraclave" class="form-label">Palabra Clave:*</label>
                    <input type="text" class="form-control" id="palabraclave" name="palabraclave" value="{{ promocion.palabraclave|default:'' }}" required>
                </div>

                <div class="mb-3">
                    <label for="tipobeneficio" class="form-label">Tipo de Beneficio:*</label>
                    <select class="form-control" id="tipobeneficio" name="tipobeneficio" required>
                        <option value="">Seleccione un tipo...</option>
                        {% for key, value in tipos_beneficio %}
                            <option value="{{ key }}" {% if promocion.tipobeneficio == key %}selected{% endif %}>{{ value }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3" id="contenedor_valor">
                    <label for="descuento" class="form-label" id="label_valor">Valor / Descuento:*</label>
                    <input type="number" step="0.01" class="form-control" id="descuento" name="descuento" value="{{ promocion.valor|default:'' }}">
                </div>

                <div class="mb-3">
                    <label for="producto" class="form-label">Producto Asociado:*</label>
                    <select class="form-control" id="producto" name="producto" required>
                        <option value="">Seleccione un producto...</option>
                        {% for prod in productos %}
                            <option value="{{ prod.idproducto }}" {% if producto_seleccionado == prod.idproducto %}selected{% endif %}>
                                {{ prod.nombre }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="fechainicio" class="form-label">Fecha de Inicio:*</label>
                    <input type="date" class="form-control" id="fechainicio" name="fechainicio" value="{{ promocion.fechainicio|date:'Y-m-d'|default:'' }}" required>
                </div>

                <div class="mb-3">
                    <label for="fechafin" class="form-label">Fecha de Fin:*</label>
                    <input type="date" class="form-control" id="fechafin" name="fechafin" value="{{ promocion.fechafin|date:'Y-m-d'|default:'' }}" required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="activo" name="activo" {% if promocion.activo == 1 or promocion.pk is None %}checked{% endif %}>
                    <label class="form-check-label" for="activo">Activo</label>
                </div>

                <button type="submit" class="btn btn-success">Guardar</button>
                <a href="{% url 'lista_promociones' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const selectTipo = document.getElementById("tipobeneficio");
            const inputValor = document.getElementById("descuento");
            const contenedorValor = document.getElementById("contenedor_valor");

            const inputFechaInicio = document.getElementById("fechainicio");
            const inputFechaFin = document.getElementById("fechafin");

            const esNuevo = document.body.dataset.esNuevo === "true";
            const hoy = new Date().toISOString().split('T')[0];

            if (esNuevo) {
                inputFechaInicio.min = hoy;
                inputFechaFin.min = hoy;
            }

            inputFechaInicio.addEventListener("change", function() {
                inputFechaFin.min = inputFechaInicio.value;
                if (inputFechaFin.value && inputFechaFin.value < inputFechaInicio.value) {
                    inputFechaFin.value = inputFechaInicio.value;
                }
            });

            function gestionarValor() {
                const tipo = selectTipo.value;
                if (tipo === "2x1" || tipo === "3x2" || tipo === "PRODUCTO_GRATIS") {
                    inputValor.removeAttribute("required");
                    inputValor.value = "";
                    contenedorValor.style.display = "none";
                } else {
                    inputValor.setAttribute("required", "true");
                    contenedorValor.style.display = "block";
                }
            }

            selectTipo.addEventListener("change", gestionarValor);
            gestionarValor();
        });
    </script>
</body>
</html>
